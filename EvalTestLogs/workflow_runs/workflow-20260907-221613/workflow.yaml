      text: "6. Cash on Delivery (\u201CCOD\u201D) 6.1 Cash on Delivery is available\
        \ on the Platform subject to pincode serviceability, Order value limits, and\
        \ verification by Byte Mart or the PSP. 6.2 An additional non-refundable charge\
        \ of \u20B9100 (Indian Rupees One Hundred only) shall be levied on every COD\
        \ Order (\u201CCOD Charge\u201D). The COD Charge is a delivery-related service\
        \ charge and is applicable to all COD Orders regardless of the value of the\
        \ Order, the delivery location, or the mode of payment chosen for the Order\
        \ value at the time of delivery. 6.3 The COD Charge is clearly displayed in\
        \ the Order summary at checkout, prior to Order placement. 6.4 The COD Charge\
        \ is not refundable in the event of: (a) Cancellation of the COD Order afterdispatch(subjecttothe\
        \ Cancellation Policy);(b)Refusalofthe CODO rderatthetimeof delivery; (c)\
        \ Return-to-Origin (\u201CRTO\u201D) of the COD Order due to Buyer unavailability,\
        \ refusal, or inability to pay. 6.5 The COD Charge shall be refunded only\
        \ where the COD Order is cancelled by Byte Mart (e.g., out of stock, pricing\
        \ error, non-serviceable pincode, or inability to verify the Order), in accordance\
        \ with the Cancellation Policy. 6.6 Mode of payment for the Order value at\
        \ the time of delivery: The Buyer may pay the Order value (Product price +\
        \ taxes) at the time of delivery using UPI or Card (debit or credit), as facilitated\
        \ by the delivery agent on a handheld terminal or by any other means as communicated.\
        \ The\u20B9100 CODC hargeremainsapplicableinallsuchcases,becausethe COD Charge\
        \ is a delivery-related service charge and not a cash-handling charge. The\
        \ COD Chargeisindependentof,andadditionalto,themodeofpaymentchosenbythe Buyerforthe\
        \ Order value. 6.7 CODO rdersaresubjecttoverificationby Byte Martand/orthe\
        \ PSP.Byte Martreservesthe rightto: (a)Cancelany CODO rderthatfailsverification,inaccordancewiththe\
        \ Cancellation Policy; (b) Impose a maximum Order value limit on COD Orders;\
        \ (c) Restrict COD availability for specific Products, categories, or pincodes;\
        \ (d) Withhold COD facility from Buyers with a history of COD refusals, RTO\
        \ s, or chargebacks. 6.8 In the event of non-payment, refusal, or inability\
        \ to pay at the time of delivery, the Order shall be treated as RTO, and Clause\
        \ 6.4 shall apply. Byte Mart may, at its discretion, suspend the Buyer\u2019\
        s COD facility for future Orders. 6.9 The PSP does not process the COD Order\
        \ value; the COD Order value is collected by Byte Mart\u2019slogisticspartneratthetimeofdelivery.\
        \ The PSP isengagedsolelyforverification, fraud-screening, and post-delivery\
        \ reconciliation of COD Orders. 7. Payment Security 7.1 All payment transactions\
        \ on the Platform are processed through PCI-DSS compliant third-party payment\
        \ gateway providers (Razorpay). Byte Mart does not store your com- plete card\
        \ or banking credentials on its servers. 7.2 In compliance with the RBI Tokenisation\
        \ Directions, 2021, Byte Mart supports card tokenisation for repeat Customers.\
        \ Tokens are stored by the payment gateway and/or the card network, not by\
        \ Byte Mart. 7.3 Allpaymentinformationistransmittedover TLS 1.2 orhigherandprotectedbyindustry-\
        \ standard encryption. 7.4 Byte Mart does not store CVV, full card numbers\
        \ (except the last 4 digits, where required for display), or full bank account\
        \ numbers. 33"
