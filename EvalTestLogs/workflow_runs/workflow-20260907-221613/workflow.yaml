        \ Exclusions from the Fast Delivery Guarantee: The guarantee does not apply\
        \ in cases of: (a) Force majeure events (see Clause 11 of the Terms); (b)\
        \ Inaccurate or incomplete de- livery address provided by the Buyer; (c) Buyer\
        \ unavailability at the delivery address after reasonable delivery attempts;\
        \ (d) Refusal to accept delivery; (e) Government-imposed restric- tions, lockdowns,\
        \ or curfews in the delivery area; (f) Non-serviceable or restricted pincode,\
        \ where Fast Delivery was inadvertently displayed. 3.5 Order Cut-off: Fast\
        \ Delivery Orders placed after the daily cut-off time (as displayed on the\
        \ Product/checkout page) shall be deemed placed on the next business day for\
        \ the purpose of computing the delivery window. 4. Regular Delivery 4.1 Charge:\
        \ Free of charge. 4.2 Delivery Timeframe: 5\u20137 business days from the\
        \ date of Order Confirmation. 4.3 Regular Deliveryisthedefaultdeliveryoptionunless\
        \ Fast Deliveryisselectedbythe Buyer at checkout. 4.4 The Regular Delivery\
        \ timeframe is indicative. Byte Mart shall not be liable for delays beyond\
        \ its reasonable control, including but not limited to logistics partner delays,\
        \ weather events, or local disruptions. 5. Serviceable Locations 5.1 Byte\
        \ Martcurrentlydeliverstoallserviceablepincodesacross India,asdeterminedbyour\
        \ logistics partners. 5.2 The Buyer may enter a pincode on any Product page\
        \ to check serviceability and the avail- able delivery options before adding\
        \ the Product to the cart. 5.3 Certainpincodesmaybeclassifiedasout-of-servicearea(\u201C\
        OSA\u201D)orrestrictedzone,in whichcasedeliverymaynotbeavailableormaybesubjecttoadditionalchargesandtimelines.\
        \ 5.4 Byte Mart reserves the right to add, modify, or remove pin codes from\
        \ its serviceable list at any time, with or without notice. 6. Order Tracking\
