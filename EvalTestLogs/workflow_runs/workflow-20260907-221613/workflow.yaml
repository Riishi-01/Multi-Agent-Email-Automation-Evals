        \ with the Return, Refund and Replacement Policy, after deduction of any return\
        \ shipping charges, if applicable; and (c) The Fast Delivery charge shall\
        \ not be refunded if the non-delivery is attributable to the Buyer\u2019s\
        \ unavailability or refusal. 8. Risk of Loss & Title 8.1 The risk of loss\
